<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Register - E-Commerce
    </title>


    <link
        rel="stylesheet"
         href="/css/user-style.css"
    >

</head>


<body>

    <div class="container">

        <div class="card">

            <h1>
                Create Account
            </h1>

            <p>
                Register for our E-Commerce platform
            </p>


            <form id="registerForm">


                <div class="form-group">

                    <label>
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Minimum 8 characters"
                        required
                    >

                </div>


                <button type="submit">

                    Create Account

                </button>


            </form>


            <div id="message"></div>


            <p class="link-text">

                Already have an account?

                <a href="/login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script
        src="/js/register.js"
    ></script>

</body>

</html>
