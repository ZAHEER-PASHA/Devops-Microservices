services:

  user-service:

    build:
      context: .

    container_name: ecommerce-user-service

    ports:
      - "5001:5001"

    environment:

      PORT: 5001

      DB_HOST: mysql

      DB_PORT: 3306

      DB_USER: root

      DB_PASSWORD: root123

      DB_NAME: ecommerce_users

      JWT_SECRET: my_super_secret_jwt_key_change_later

      JWT_EXPIRES_IN: 1h

      NODE_ENV: development

    depends_on:

      mysql:
        condition: service_healthy


  mysql:

    image: mysql:8.4

    container_name: ecommerce-mysql

    environment:

      MYSQL_ROOT_PASSWORD: root123

      MYSQL_DATABASE: ecommerce_users

    ports:

      - "3306:3306"

    volumes:

      - mysql_data:/var/lib/mysql

    healthcheck:

      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot123"
        ]

      interval: 5s

      timeout: 5s

      retries: 10


volumes:

  mysql_data: