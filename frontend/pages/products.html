<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products - E-Commerce</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        E-Commerce
    </div>

    <div class="user-section">

        <span id="welcomeUser">
            Welcome
        </span>

        <button id="logoutBtn" class="btn-logout">
            Logout
        </button>

    </div>

</header>


<main class="container">

    <div class="page-header">

        <div>
            <h1>Products</h1>
            <p>Manage your products</p>
        </div>

        <button id="addProductBtn" class="btn-primary">
            + Add Product
        </button>

    </div>


    <div id="message" class="message"></div>


    <div id="productContainer" class="product-grid">

        <p id="loading">
            Loading products...
        </p>

    </div>

</main>


<!-- Product Modal -->

<div id="productModal" class="modal hidden">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">
                Add Product
            </h2>

            <button id="closeModal" class="close-btn">
                ×
            </button>

        </div>


        <form id="productForm">

            <input
                type="hidden"
                id="productId"
            >


            <div class="form-group">

                <label for="productName">
                    Product Name
                </label>

                <input
                    type="text"
                    id="productName"
                    required
                >

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    rows="3"
                ></textarea>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="price">
                        Price
                    </label>

                    <input
                        type="number"
                        id="price"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="stock">
                        Stock
                    </label>

                    <input
                        type="number"
                        id="stock"
                        min="0"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <input
                    type="text"
                    id="category"
                >

            </div>


            <div class="form-group">

                <label for="imageUrl">
                    Image URL
                </label>

                <input
                    type="url"
                    id="imageUrl"
                    placeholder="https://example.com/image.jpg"
                >

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    id="cancelBtn"
                    class="btn-secondary"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Save Product
                </button>

            </div>

        </form>

    </div>

</div>


<script src="../js/app.js"></script>

</body>

</html>
